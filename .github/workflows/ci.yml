name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Unit + integración (Testcontainers levanta SQL Server 2022 en el runner).
      # La cobertura de los dos proyectos se combina y debe superar 80% de líneas.
      - name: Test with coverage
        run: >
          dotnet test --no-build -c Release -m:1
          -p:CollectCoverage=true
          -p:Threshold=80
          -p:ThresholdType=line

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-coverage
          path: coverage/backend/
          if-no-files-found: ignore

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: frontend-coverage
          path: web/coverage/
          if-no-files-found: ignore

  docker:
    name: Docker + smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 300

      - name: Check health and API
        run: |
          curl -fsS http://localhost:8080/health
          curl -fsS -o /dev/null http://localhost:8080/swagger/index.html
          curl -fsS "http://localhost:3000/api/works?pageNumber=1&pageSize=10"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Playwright smoke test
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
