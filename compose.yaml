name: library

# Contraseña de SA: se toma de .env (ver .env.example). El valor por defecto es solo para la
# demo local, para que funcione desde un clon limpio. No es un secreto real: en producción se usa
# un usuario con permisos mínimos y la contraseña sale de un gestor de secretos.
x-sa-password: &sa-password ${MSSQL_SA_PASSWORD:-ChangeMe_StrongPassword123!}

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: library-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: *sa-password
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: library-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=LibraryDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-ChangeMe_StrongPassword123!};Encrypt=True;TrustServerCertificate=True;"
      ApplyMigrations: "true"
      SeedData__Enabled: "true"
      Swagger__Enabled: "true"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: library-web
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlserver-data:
